<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes generales - Becas Uleam</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="styleadmin.css">
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="logo"><span aria-hidden="true">U</span>Admin Becas</div>
            <nav aria-label="Menú del administrador">
                <a href="index.html">Verificación de Postulaciones</a>
                <a href="../preguntas/index.html">Preguntas y respuestas</a>
                <a href="reportes.html" class="active" aria-current="page">Reportes Generales</a>
                <a href="becas.html">Configuración de Becas</a>
            </nav>
            <button type="button" class="btn btn--secundario btn--sm logout">Cerrar sesión</button>
        </aside>

        <main class="main-content">
            <header>
                <div>
                    <h1>Reportes generales</h1>
                    <p class="sub" id="resumen">Cargando…</p>
                </div>
                <div class="acciones-cab">
                    <button type="button" class="btn btn--secundario btn--sm" id="btn-actualizar">Actualizar</button>
                    <button type="button" class="btn btn--primario btn--sm" id="btn-csv" disabled>Descargar CSV</button>
                    <div class="user-profile" id="usuario-nombre"></div>
                </div>
            </header>

            <div id="contenido-reportes">
                <section class="kpis" id="kpis" aria-label="Indicadores generales"></section>
                <div class="rejilla-2">
                    <section class="card panel-rep" aria-labelledby="t-res"><h2 id="t-res">Resultado de las postulaciones</h2><div id="resultado"></div></section>
                    <section class="card panel-rep" aria-labelledby="t-rank"><h2 id="t-rank">Becas más solicitadas</h2><div id="ranking"></div></section>
                </div>
                <section class="card panel-rep" aria-labelledby="t-eta"><h2 id="t-eta">Postulaciones por etapa</h2><div id="etapas"></div></section>
            </div>
        </main>
    </div>

    <dialog id="modal" class="modal" aria-labelledby="modal-titulo"></dialog>

    <script src="../assets/js/core.js"></script>
    <script src="reportesscript.js"></script>
</body>
</html>
