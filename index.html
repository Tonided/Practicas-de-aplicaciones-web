<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de estudiantes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Registro de estudiantes</h1>

  <form id="formulario" novalidate>
    <label class="ancho">Cédula
      <input name="cedula" maxlength="10" placeholder="10 dígitos">
      <small class="error"></small>
    </label>
    <label>Apellidos
      <input name="apellidos" placeholder="Mendoza Zambrano">
      <small class="error"></small>
    </label>
    <label>Nombres
      <input name="nombres" placeholder="María José">
      <small class="error"></small>
    </label>
    <label class="ancho">Dirección
      <input name="direccion" placeholder="Av. 4 de Noviembre y Calle 12">
      <small class="error"></small>
    </label>
    <label>Teléfono
      <input name="telefono" maxlength="10" placeholder="0991234567">
      <small class="error"></small>
    </label>
    <label>Correo electrónico
      <input name="correo" placeholder="nombre@correo.com">
      <small class="error"></small>
    </label>
    <label class="ancho">Facultad
      <input name="facultad" placeholder="Ciencias de la Vida y la Tecnología">
      <small class="error"></small>
    </label>
    <label>Nivel
      <input name="nivel" maxlength="2" placeholder="1 a 10">
      <small class="error"></small>
    </label>
    <label>Paralelo
      <input name="paralelo" maxlength="1" placeholder="A">
      <small class="error"></small>
    </label>
    <div class="ancho">
      <button type="submit">Guardar estudiante</button>
      <span id="mensaje"></span>
    </div>
  </form>

  <h2>Estudiantes registrados</h2>
  <div class="tabla">
    <table>
      <thead>
        <tr>
          <th>Cédula</th><th>Apellidos</th><th>Nombres</th><th>Dirección</th><th>Teléfono</th>
          <th>Correo</th><th>Facultad</th><th>Nivel</th><th>Paralelo</th><th></th>
        </tr>
      </thead>
      <tbody id="tabla"></tbody>
    </table>
  </div>

  <h2>JSON guardado en localStorage</h2>
  <pre id="json"></pre>

  <script src="script.js"></script>
</body>
</html>
