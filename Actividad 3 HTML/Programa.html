<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro de Clientes</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Registro de Clientes</h1>

  <form id="formCliente">

    <label for="cedula">Cédula (10 dígitos)</label>
    <input type="text" id="cedula" maxlength="10">
    <span class="error" id="errorCedula"></span>

    <label for="nombre">Nombre (máx. 30 caracteres)</label>
    <input type="text" id="nombre" maxlength="30">
    <span class="error" id="errorNombre"></span>

    <label for="direccion">Dirección (máx. 50 caracteres)</label>
    <input type="text" id="direccion" maxlength="50">
    <span class="error" id="errorDireccion"></span>

    <label for="telefono">Teléfono celular (10 dígitos)</label>
    <input type="text" id="telefono" maxlength="10">
    <span class="error" id="errorTelefono"></span>

    <label for="correo">Correo electrónico</label>
    <input type="email" id="correo">
    <span class="error" id="errorCorreo"></span>

    <button type="submit">Registrar</button>

  </form>

  <p id="resultado"></p>

  <script src="validaciones.js"></script>
</body>
</html>
